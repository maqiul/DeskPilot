name: Release

# ========================================
# GitHub Actions Release Workflow
# ========================================
# 触发：推送 v*.*.* tag（如 v0.4.0）
# 产物：DeskPilot-Mcp-vX.Y.Z-win-x64.zip + checksums
# ========================================

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:        # 手动触发

permissions:
  contents: write           # 创建 Release 需要写权限

jobs:
  build-mcp:
    name: Build MCP Server (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeskPilot.slnx

      - name: Publish Mcp (win-x64, self-contained)
        shell: cmd
        run: |
          dotnet publish src/DeskPilot.Mcp/DeskPilot.Mcp.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained true ^
            -p:PublishSingleFile=true ^
            -p:PublishTrimmed=true ^
            -p:EnableCompressionInSingleFile=true ^
            -p:IncludeNativeLibrariesForSelfExtract=true ^
            -p:DebugType=embedded ^
            -o publish/Mcp

      - name: List publish output
        shell: cmd
        run: dir publish\Mcp

      - name: Zip Mcp
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-Mcp-$version-win-x64.zip"
          Compress-Archive -Path publish/Mcp/* -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-Mcp-$version-win-x64.zip"
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipName $hash" | Out-File -Encoding utf8 "$zipName.sha256"
          Get-Content "$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskpilot-mcp-win-x64
          path: |
            DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip
            DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip.sha256
          if-no-files-found: error

  build-app:
    name: Build DeskPilot App (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + Build + Test
        shell: cmd
        run: |
          call clean.bat

      - name: Publish App (win-x64, framework-dependent)
        shell: cmd
        run: |
          dotnet publish src/DeskPilot.App/DeskPilot.App.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained false ^
            -p:PublishSingleFile=false ^
            -o publish/App

      - name: Zip App
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-App-$version-win-x64.zip"
          Compress-Archive -Path publish/App/* -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-App-$version-win-x64.zip"
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipName $hash" | Out-File -Encoding utf8 "$zipName.sha256"
          Get-Content "$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskpilot-app-win-x64
          path: |
            DeskPilot-App-${{ github.ref_name }}-win-x64.zip
            DeskPilot-App-${{ github.ref_name }}-win-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mcp, build-app]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== All artifacts ==="
          ls -laR artifacts/

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          # v0.4.0 → RELEASE_NOTES_v0.4.0.md
          # v0.4.1 → RELEASE_NOTES_v0.4.1.md
          # v0.4.0-rc1 → RELEASE_NOTES_v0.4.0-rc1.md
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="RELEASE_NOTES.md"
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="CHANGELOG.md"
          fi
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            {
              echo "notes<<NOTES_EOF"
              cat "$NOTES_FILE"
              echo "NOTES_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No release notes file found, using default"
            echo "notes<<EOF" >> "$GITHUB_OUTPUT"
            echo "## DeskPilot ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.notes.outputs.notes }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}