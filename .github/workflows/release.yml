name: Release

# ========================================
# GitHub Actions Release Workflow
# ========================================
# 触发：推送 v*.*.* tag（如 v0.4.0）
# 产物：DeskPilot-Mcp-vX.Y.Z-win-x64.zip + checksums
# ========================================

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:        # 手动触发

permissions:
  contents: write           # 创建 Release 需要写权限

jobs:
  build-mcp:
    name: Build MCP Server (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DeskPilot.sln

      - name: Publish Mcp (win-x64, self-contained)
        shell: cmd
        run: |
          dotnet publish src/DeskPilot.Mcp/DeskPilot.Mcp.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained true ^
            -p:PublishSingleFile=true ^
            -p:PublishTrimmed=true ^
            -p:EnableCompressionInSingleFile=true ^
            -p:IncludeNativeLibrariesForSelfExtract=true ^
            -p:DebugType=embedded ^
            -o publish/Mcp

      - name: List publish output
        shell: cmd
        run: dir publish\Mcp

      - name: Zip Mcp
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-Mcp-$version-win-x64.zip"
          Compress-Archive -Path publish/Mcp/* -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-Mcp-$version-win-x64.zip"
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipName $hash" | Out-File -Encoding utf8 "$zipName.sha256"
          Get-Content "$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskpilot-mcp-win-x64
          path: |
            DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip
            DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip.sha256
          if-no-files-found: error

  build-app:
    name: Build DeskPilot App (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + Build + Test
        shell: cmd
        run: |
          call clean.bat

      - name: Publish App (win-x64, self-contained, single-file)
        shell: cmd
        run: |
          dotnet publish src/DeskPilot.App/DeskPilot.App.csproj ^
            -c Release ^
            -r win-x64 ^
            --self-contained true ^
            -p:PublishSingleFile=true ^
            -p:PublishTrimmed=false ^
            -p:EnableCompressionInSingleFile=true ^
            -p:IncludeNativeLibrariesForSelfExtract=true ^
            -p:IncludeAllContentForSelfExtract=true ^
            -p:DebugType=embedded ^
            -o publish/App

      - name: Zip App
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-App-$version-win-x64.zip"
          Compress-Archive -Path publish/App/* -DestinationPath $zipName -Force
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zipName = "DeskPilot-App-$version-win-x64.zip"
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$zipName $hash" | Out-File -Encoding utf8 "$zipName.sha256"
          Get-Content "$zipName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskpilot-app-win-x64
          path: |
            DeskPilot-App-${{ github.ref_name }}-win-x64.zip
            DeskPilot-App-${{ github.ref_name }}-win-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-mcp, build-app]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (for release notes)
        uses: actions/checkout@v4
        # v0.7 修复：不用 sparse-checkout + ref:master（会导致 detached HEAD
        # 让 softprops/action-gh-release 的 git 操作报错 exit code 128）。
        # tag 前的 commit 已包含 CHANGELOG/RELEASE_NOTES，直接 checkout 即可。

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== All artifacts ==="
          ls -laR artifacts/

      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME}
          # v0.4.0 → RELEASE_NOTES_v0.4.0.md
          # v0.4.1 → RELEASE_NOTES_v0.4.1.md
          # v0.4.0-rc1 → RELEASE_NOTES_v0.4.0-rc1.md
          NOTES_FILE="RELEASE_NOTES_${VERSION}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="RELEASE_NOTES.md"
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="CHANGELOG.md"
          fi
          # v0.5: 改用 body_path 而非 body=GITHUB_OUTPUT
          # 原因：GITHUB_OUTPUT 多行传递经常被 GitHub 截断/吞行
          # 写文件 + body_path 是社区最稳的方案
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            # 从完整 CHANGELOG 中提取当前版本 section (## [vX.Y.Z] ...)
            # 然后写进 release_notes.md
            awk "/^## \\[${VERSION}\\]/,/^## \\[/" "$NOTES_FILE" | head -n -1 > release_notes.md
            # 确保非空（如果没匹配到，回退到整文件）
            if [ ! -s release_notes.md ]; then
              cp "$NOTES_FILE" release_notes.md
            fi
          else
            echo "No release notes file found, using default"
            {
              echo "## DeskPilot ${VERSION}"
              echo ""
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details."
            } > release_notes.md
          fi
          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          overwrite: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release_notes.md
          files: |
            artifacts/DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip
            artifacts/DeskPilot-Mcp-${{ github.ref_name }}-win-x64.zip.sha256
            artifacts/DeskPilot-App-${{ github.ref_name }}-win-x64.zip
            artifacts/DeskPilot-App-${{ github.ref_name }}-win-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}