name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore DeskPilot.slnx

    - name: Build
      run: dotnet build DeskPilot.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test DeskPilot.slnx --no-build --configuration Release --verbosity normal

    - name: Publish artifact (Windows)
      run: dotnet publish src/DeskPilot.App/DeskPilot.App.csproj -c Release -r win-x64 --self-contained false -o ./publish
      if: github.ref == 'refs/heads/main'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deskpilot-windows
        path: ./publish
      if: github.ref == 'refs/heads/main'