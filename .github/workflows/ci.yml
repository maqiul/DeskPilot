name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore DeskPilot.slnx

    - name: Build
      run: dotnet build DeskPilot.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test DeskPilot.slnx --no-build --configuration Release --verbosity normal

    # v0.5.1: WPF 启动 smoke test — 用 DESKPILOT_SMOKE_TEST=1 走全链路
    # 覆盖 XAML 解析 → DI 注入 → ChatWindow 实例化 → 无异常退出
    - name: WPF App smoke test
      shell: pwsh
      env:
        DESKPILOT_SMOKE_TEST: "1"
      run: |
        $exe = "src\DeskPilot.App\bin\Release\net8.0-windows\DeskPilot.App.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "WPF App.exe not found at $exe"
          exit 1
        }
        $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden -Wait
        if ($proc.ExitCode -eq 0) {
          Write-Host "✅ WPF smoke test PASSED (exit 0)"
        } else {
          Write-Error "❌ WPF smoke test FAILED (exit $($proc.ExitCode))"
          exit 1
        }

    - name: Publish artifact (Windows)
      run: dotnet publish src/DeskPilot.App/DeskPilot.App.csproj -c Release -r win-x64 --self-contained false -o ./publish
      if: github.ref == 'refs/heads/main'

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: deskpilot-windows
        path: ./publish
      if: github.ref == 'refs/heads/main'